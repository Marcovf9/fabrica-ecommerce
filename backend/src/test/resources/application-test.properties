# Perfil de tests: H2 en memoria con dialecto MySQL, sin Flyway ni data.sql
spring.datasource.url=jdbc:h2:mem:fabrica_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never

# Credenciales ficticias: ningún test llama a servicios externos
cloudinary.url=cloudinary://key:secret@test-cloud
mercadopago.access.token=TEST-token
spring.mail.password=unused
